# ============================================================
# ACTIVE PROFILE
# ============================================================
# This tells Spring Boot to load application-local.properties
spring.profiles.active=local

# ============================================================
# DATABASE CONFIGURATION
# ============================================================
# MySQL database connection settings
# Now using environment variables from .env file
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Caterfind1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
# Hibernate DDL auto (create, create-drop, validate, update)
# Using 'update' to auto-create tables from entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SQL INITIALIZATION
# ============================================================
# Temporarily disabled - Hibernate will auto-create tables
# Uncomment these lines after first successful run if you want to use schema.sql
#spring.sql.init.mode=always
# spring.sql.init.continue-on-error=true
# spring.sql.init.data-locations=classpath:init-data.sql

# ============================================================
# TWILIO CONFIGURATION FOR SMS
# ============================================================
# Using environment variables from .env file
# Get credentials from: https://console.twilio.com/
twilio.accountSid=${TWILIO_ACCOUNT_SID:YOUR_TWILIO_SID}
twilio.authToken=${TWILIO_AUTH_TOKEN:YOUR_TWILIO_TOKEN}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER:YOUR_TWILIO_PHONE_NUMBER}
twilio.callbackUrl=https://unmannishly-unmusicianly-chieko.ngrok-free.dev

# ============================================================
# CALLING CONFIGURATION
# ============================================================
# Provider options: twilio, exotel
app.calling.provider=twilio

# ============================================================
# EXOTEL CONFIGURATION
# ============================================================
# Dashboard: https://my.exotel.com/
exUsing environment variables from .env file
# Dashboard: https://my.exotel.com/
exotel.sid=${EXOTEL_SID:YOUR_EXOTEL_SID}
exotel.token=${EXOTEL_TOKEN:YOUR_EXOTEL_TOKEN}
exotel.apiKey=${EXOTEL_API_KEY:}
exotel.subdomain=${EXOTEL_SUBDOMAIN:api}
exotel.callerId=${EXOTEL_CALLER_ID:YOUR_EXOTEL_VIRTUAL_NUMBER}e customer to
exotel.appletId=

# ============================================================
# Using environment variables from .env file
# Use an App Password, not your regular password
# Generate at: https://myaccount.google.com/apppasswords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:YOUR_GMAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD:YOUR_GMAIL_APP_PASSWORD}
spring.mail.username=YOUR_GMAIL_USERNAME
spring.mail.password=YOUR_GMAIL_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
# Directory where uploaded files will be stored
file.upload-dir=uploads/images

# Maximum file size (10MB)
spring.servlet.multipart.max-file-size=10MB
# Maximum request size (10MB)
spring.servlet.multipart.max-request-size=10MB
# Enable multipart uploads
spring.servlet.multipart.enabled=true

# ============================================================
# CALENDAR EVENT CLEANUP CONFIGURATION
# ============================================================
# Enable/disable automatic cleanup of old calendar events
calendar.cleanup.enabled=true
# Retention period in days (events older than this will be deleted)
calendar.cleanup.retention.days=30
# Cron expression for cleanup schedule (default: 2:00 AM daily)
# Format: second minute hour day month weekday
calendar.cleanup.cron=0 0 2 * * ?

# ============================================================
# OPENAI CONFIGURATION (For Translation)
# Using environment variables from .env file
# Get your API key from: https://platform.openai.com/api-keys
openai.api.key=${OPENAI_API_KEY:YOUR_OPENAI_API_KEY}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}
openai.model=${OPENAI_MODEL:gpt-3.5-turbo}.openai.com/v1/chat/completions
openai.model=gpt-3.5-turbo
