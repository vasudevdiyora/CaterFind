# ============================================================
# RUNTIME PROFILE / SERVER
# ============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework

# ============================================================
# CORS / ERROR RESPONSE CONFIGURATION
# ============================================================
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.errors.include-stacktrace=${APP_ERRORS_INCLUDE_STACKTRACE:false}
app.admin.email=${ADMIN_EMAIL:admin@gmail.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
# ============================================================
# DATABASE CONFIGURATION
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:caterfind}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# SQL INITIALIZATION
# ============================================================
spring.sql.init.mode=${SQL_INIT_MODE}

# ============================================================
# TWILIO CONFIGURATION
# ============================================================
twilio.accountSid=${TWILIO_ACCOUNT_SID}
twilio.authToken=${TWILIO_AUTH_TOKEN}
twilio.phoneNumber=${TWILIO_PHONE_NUMBER}
twilio.callbackUrl=${TWILIO_CALLBACK_URL}

# ============================================================
# CALLING CONFIGURATION
# ============================================================
app.calling.provider=${APP_CALLING_PROVIDER}

# ============================================================
# EXOTEL CONFIGURATION
# ============================================================
exotel.sid=${EXOTEL_SID}
exotel.token=${EXOTEL_TOKEN}
exotel.apiKey=${EXOTEL_API_KEY}
exotel.subdomain=${EXOTEL_SUBDOMAIN}
exotel.callerId=${EXOTEL_CALLER_ID}
exotel.appletId=${EXOTEL_APPLET_ID}

# ============================================================
# EMAIL CONFIGURATION
# ============================================================
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================================
# FILE UPLOAD CONFIGURATION
# ============================================================
file.upload-dir=${FILE_UPLOAD_DIR}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE}
spring.servlet.multipart.enabled=true

# ============================================================
# CALENDAR CLEANUP CONFIGURATION
# ============================================================
calendar.cleanup.enabled=${CALENDAR_CLEANUP_ENABLED}
calendar.cleanup.retention.days=${CALENDAR_CLEANUP_RETENTION_DAYS}
calendar.cleanup.cron=${CALENDAR_CLEANUP_CRON}

# ============================================================
# OPENAI CONFIGURATION
# ============================================================
openai.api.key=${OPENAI_API_KEY}
openai.api.url=${OPENAI_API_URL}
openai.model=${OPENAI_MODEL}

# ============================================================
# SECURITY CONFIGURATION (JWT + OTP)
# ============================================================
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}
security.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS}
security.otp.pepper=${OTP_PEPPER}


